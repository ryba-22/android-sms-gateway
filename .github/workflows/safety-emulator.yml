name: Safety emulator (no SMS)

on:
  push:
    branches: ["feat/hard-sending-policy-implementation"]
    paths:
      - ".github/workflows/safety-emulator.yml"
      - "app/src/androidTest/java/me/capcom/smsgateway/modules/messages/policy/SafetyInstrumentedTest.kt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-safety:
    name: Safety instrumentation (Android API 30)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare CI-only Firebase stub
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "android-sms-gateway-ci-only"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "me.capcom.smsgateway"
                  }
                },
                "api_key": [
                  {"current_key": "NOT_A_REAL_FIREBASE_API_KEY_CI_ONLY"}
                ]
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Run no-SMS policy and SQLite instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class me.capcom.smsgateway.modules.messages.policy.SafetyInstrumentedTest me.capcom.smsgateway.test/androidx.test.runner.AndroidJUnitRunner | tee safety-output.txt
            grep -q "OK (4 tests)" safety-output.txt
            ! grep -q "FAILURES!!!" safety-output.txt

      - name: Upload emulator failure output only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: safety-emulator-failure
          path: safety-output.txt
          retention-days: 3
          if-no-files-found: ignore
